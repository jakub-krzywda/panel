<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dziennik{% endblock %}</title>
  <link rel="stylesheet" href="{{ static('app.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  {% set section = section | default("") %}
  <header class="app-header">
    <div class="container inner">
      <a class="brand" href="/"><span class="dot"></span>Dziennik</a>
      <nav class="nav">
        <a href="/" class="{{ 'active' if section == 'day' }}">Dziś</a>
        <a href="/history" class="{{ 'active' if section == 'history' }}">Historia</a>
        <a href="/stats" class="{{ 'active' if section == 'stats' }}">Statystyki</a>
        <a href="/config" class="{{ 'active' if section == 'config' }}">Ustawienia</a>
      </nav>
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
