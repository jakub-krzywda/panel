[project]
name = "dziennik"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "ocrmac>=1.0.1",
    "opencv-python-headless>=5.0.0.93",
    "pymupdf>=1.28.2",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
